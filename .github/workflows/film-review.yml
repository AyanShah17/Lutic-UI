name: Lutic film review
on:
  workflow_dispatch:
  push:
    branches: [design/lutic-experience]
    paths: ['tools/capture_film.py', '.github/workflows/film-review.yml', 'index.html', '*.css', '*.js']
  pull_request:
    branches: [main]
    paths: ['tools/capture_film.py', '.github/workflows/film-review.yml', 'index.html', '*.css', '*.js']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0 pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Locate Chromium
        run: |
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser" ]; then
            echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: python tools/capture_film.py --out film-review
      - uses: actions/upload-artifact@v4
        with:
          name: lutic-film-review
          path: film-review/
          retention-days: 14
